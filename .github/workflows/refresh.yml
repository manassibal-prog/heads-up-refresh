name: heads-up-refresh
on:
  schedule:
    - cron: "30 5 * * *"        # 11:00 IST
    - cron: "0,30 6-15 * * *"   # 11:30-21:00 IST
  workflow_dispatch: {}         # manual "Run workflow" button for testing
concurrency:
  group: heads-up-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/refresh.py
        env:
          MB_URL: ${{ secrets.MB_URL }}
          MB_KEY: ${{ secrets.MB_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ENFORCE_HOURS: "1"
