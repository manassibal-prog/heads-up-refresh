name: heads-up-refresh
on:
  # Schedule removed: the live runner is the Google Apps Script project (apps_script/). This workflow stays
  # as a manual backup only (Actions > Run workflow).
  workflow_dispatch:            # manual "Run workflow" button for testing
    inputs:
      trial:
        description: "Trial: today's data into temp tabs (type a start date e.g. 2026-10-19), leave empty for real run"
        type: string
        default: ""
      check:
        description: "Only test Google Sheets access (writes nothing)"
        type: boolean
        default: false
concurrency:
  group: heads-up-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/refresh.py ${{ inputs.check && '--check' || '' }}
        env:
          MB_URL: ${{ secrets.MB_URL }}
          MB_KEY: ${{ secrets.MB_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ENFORCE_HOURS: "1"
          TRIAL: ${{ inputs.trial }}
